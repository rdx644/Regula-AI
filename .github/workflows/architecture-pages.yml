name: Publish architecture diagram

on:
  push:
    branches: [main]
    paths:
      - ".archify/architecture-regulaai-20261010-035812/regulaai.html"
      - ".github/workflows/architecture-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publish:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Prepare standalone diagram page
        run: |
          mkdir -p site/architecture
          cp .archify/architecture-regulaai-20261010-035812/regulaai.html site/architecture/index.html
          touch site/.nojekyll
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
