name: Render blueprint

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install schema validator
        run: python -m pip install PyYAML==6.0.3 jsonschema==4.26.0
      - name: Validate Render blueprints against the published schema
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from urllib.request import urlopen
          import jsonschema
          import yaml

          with urlopen('https://render.com/schema/render.yaml.json', timeout=30) as response:
              schema = json.load(response)
          def load_blueprint(filename):
              blueprint = yaml.safe_load(Path(filename).read_text(encoding='utf-8'))
              jsonschema.validate(blueprint, schema)
              for service in blueprint['services']:
                  if service.get('plan') == 'free':
                      assert 'maxShutdownDelaySeconds' not in service
                  if service['type'] == 'keyvalue':
                      assert service['ipAllowList'] == []
                      assert service['maxmemoryPolicy'] == 'noeviction'
                  else:
                      assert Path(service['dockerfilePath']).is_file()
                      assert Path(service['dockerContext']).is_dir()
              for database in blueprint['databases']:
                  assert database['ipAllowList'] == []
              return blueprint

          preview = load_blueprint('render.yaml')
          shared = {item['key']: item['value'] for item in preview['envVarGroups'][0]['envVars']}
          assert shared['MODEL_EXECUTION_ENABLED'] == 'false'
          assert shared['ENVIRONMENT'] == 'staging'
          assert shared['STORAGE_BACKEND'] == 's3'
          assert shared['ENABLE_RATE_LIMITING'] == 'true'

          demo = load_blueprint('render.hackathon.yaml')
          demo_env = {item['key']: item['value'] for item in demo['envVarGroups'][0]['envVars']}
          assert demo_env['ENVIRONMENT'] == 'demo'
          assert demo_env['MODEL_EXECUTION_ENABLED'] == 'false'
          assert demo_env['STORAGE_BACKEND'] == 'local'
          assert demo_env['SESSION_COOKIE_SECURE'] == 'true'
          assert demo_env['RUN_EMBEDDED_WORKER'] == 'true'
          assert demo_env['ENABLE_RATE_LIMITING'] == 'true'
          assert all(service['plan'] == 'free' for service in demo['services'])
          assert all(database['plan'] == 'free' for database in demo['databases'])
          assert all(service['type'] != 'worker' for service in demo['services'])
          assert not any(item.get('key', '').startswith(('S3_', 'AWS_')) for service in demo['services'] for item in service.get('envVars', []))
          print('Render schema, S3-backed preview and all-free synthetic demo settings passed; no resources provisioned.')
          PY
