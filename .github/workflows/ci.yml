name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: regula_ai
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_only_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d regula_ai"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      SQLALCHEMY_DATABASE_URI: postgresql+psycopg2://postgres:test_only_password@localhost:5432/regula_ai
      SECRET_KEY: ci-only-secret-key-not-for-any-deployment
      ENVIRONMENT: test
      REDIS_URL: redis://localhost:6379/0
      STORAGE_BACKEND: local
      UPLOAD_STORAGE_DIR: /tmp/regulaai-private-uploads
      MODEL_EXECUTION_ENABLED: 'false'
      ALLOWED_HOSTS: '["localhost","testserver"]'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install backend dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Validate dependency resolution
        run: python -m pip check
      - name: Check undefined Python names
        run: python -m ruff check app scripts tests --select F821,F822,F823
      - name: Apply database migrations
        run: python -m alembic upgrade head
      - name: Check migration consistency
        run: python -m alembic check
      - name: Test backend and security boundaries
        run: python -m pytest -q
      - name: Verify worker registry imports
        run: python -c "from app.workers.handlers import get_handlers; assert len(get_handlers()) == 14"
      - name: Audit backend dependencies
        run: python -m pip_audit

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: regula_ai
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_only_password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d regula_ai"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      SQLALCHEMY_DATABASE_URI: postgresql+psycopg2://postgres:test_only_password@localhost:5432/regula_ai
      SECRET_KEY: ci-only-secret-key-not-for-any-deployment
      ENVIRONMENT: test
      REDIS_URL: redis://localhost:6379/0
      STORAGE_BACKEND: local
      UPLOAD_STORAGE_DIR: /tmp/regulaai-browser-private-uploads
      ALLOWED_HOSTS: '["localhost","127.0.0.1","testserver"]'
      MODEL_EXECUTION_ENABLED: 'false'
      JOB_QUEUE_PREFIX: regulaai:browser:ci
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare PostgreSQL-backed browser API and worker
        working-directory: backend
        run: |
          python -m pip install -r requirements-dev.txt
          python -m alembic upgrade head
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: |
          npx next typegen
          npx tsc --noEmit --incremental false
      - name: Production build
        run: npm run build
      - name: Audit frontend runtime dependencies
        run: npm audit --omit=dev
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Browser workflows and accessibility (synthetic model adapter)
        run: npx playwright test
      # Traces contain session cookies. Never upload traces or private source files.
