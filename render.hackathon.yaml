# Temporary free tier for a public hackathon demo with synthetic data only.
# The worker runs inside the free API web service. Uploaded files are ephemeral.
# The regular render.yaml remains the separate S3-backed preview blueprint.
# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
services:
  - type: web
    name: regulaai-hackathon-api
    runtime: docker
    plan: free
    region: singapore
    branch: main
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: python /app/start_render.py
    healthCheckPath: /api/health/live
    autoDeployTrigger: checksPass
    envVars:
      - fromGroup: regulaai-hackathon-config
      - key: SECRET_KEY
        generateValue: true
      - key: OPS_METRICS_TOKEN
        generateValue: true
      - key: ALLOWED_HOSTS
        fromService:
          type: web
          name: regulaai-hackathon-api
          envVarKey: RENDER_EXTERNAL_HOSTNAME
      - key: BACKEND_CORS_ORIGINS
        fromService:
          type: web
          name: regulaai-hackathon-web
          envVarKey: RENDER_EXTERNAL_URL
      - key: SQLALCHEMY_DATABASE_URI
        fromDatabase:
          name: regulaai-hackathon-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: regulaai-hackathon-redis
          property: connectionString

  - type: web
    name: regulaai-hackathon-web
    runtime: docker
    plan: free
    region: singapore
    branch: main
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    healthCheckPath: /
    autoDeployTrigger: checksPass
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: /api
      - key: API_PROXY_ORIGIN
        fromService:
          type: web
          name: regulaai-hackathon-api
          envVarKey: RENDER_EXTERNAL_URL

  - type: keyvalue
    name: regulaai-hackathon-redis
    plan: free
    region: singapore
    ipAllowList: []
    maxmemoryPolicy: noeviction

databases:
  - name: regulaai-hackathon-postgres
    plan: free
    region: singapore
    postgresMajorVersion: "16"
    databaseName: regulaai
    user: regulaai
    ipAllowList: []

envVarGroups:
  - name: regulaai-hackathon-config
    envVars:
      - key: ENVIRONMENT
        value: demo
      - key: PROJECT_NAME
        value: RegulaAI Hackathon Demo
      - key: API_V1_STR
        value: /api
      - key: JWT_ISSUER
        value: regulaai-api
      - key: JWT_AUDIENCE
        value: regulaai-web
      - key: ENABLE_RATE_LIMITING
        value: "true"
      - key: RATE_LIMIT_REQUESTS_PER_MINUTE
        value: "120"
      - key: LOGIN_RATE_LIMIT_PER_MINUTE
        value: "10"
      - key: AGENT_RATE_LIMIT_PER_MINUTE
        value: "20"
      - key: STORAGE_BACKEND
        value: local
      - key: UPLOAD_STORAGE_DIR
        value: /tmp/regulaai-hackathon-uploads
      - key: MAX_UPLOAD_BYTES
        value: "10485760"
      - key: MODEL_EXECUTION_ENABLED
        value: "false"
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: RUN_EMBEDDED_WORKER
        value: "true"
      - key: WORKER_MAX_CONCURRENT
        value: "1"
      - key: AI_REQUESTS_PER_TENANT_PER_DAY
        value: "20"
      - key: AI_TOKENS_PER_TENANT_PER_DAY
        value: "40000"
      - key: JOB_QUEUE_PREFIX
        value: regulaai:render:hackathon
