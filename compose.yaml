# Local development dependencies only. These credentials and host-only ports are
# intentionally non-production; do not reuse them in shared or deployed systems.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: regula_ai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local_dev_only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - regulaai-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d regula_ai"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  regulaai-postgres:
